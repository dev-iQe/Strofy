name: Build iOS App (Strofy)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # هذا السطر يسمح لك بتشغيل البناء يدوياً من زر Actions

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build IPA
      run: |
        # بناء التطبيق بدون توقيع لكي تتمكن من تثبيته لاحقاً
        xcodebuild clean build \
          -project Strofy.xcodeproj \
          -scheme Strofy \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR=$(PWD)/build
          
        # نسخ فيديو البداية يدوياً إلى داخل حزمة التطبيق لضمان عمله
        cp Strofy/video.mov build/Strofy.app/
        
        # تجهيز مجلد Payload وضغط التطبيق بصيغة ipa
        mkdir -p Payload
        cp -r build/Strofy.app Payload/
        zip -qr Strofy.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Strofy-IPA
        path: Strofy.ipa
